doctrine:
    dbal:
        url: '%env(DATABASE_URL)%'
        server_version: '17'
    orm:
        auto_mapping: false
        enable_native_lazy_objects: true
        mappings:
            App:
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                is_bundle: false
