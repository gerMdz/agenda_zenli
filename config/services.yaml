parameters:
    zenli.origen_claves_acceso: 'https://zenli.ar'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Controller\:
        resource: ../src/Controller/

    App\Agenda\Disponibilidad: ~
    App\Agenda\AgendaPostgresql: ~

    App\Administracion\:
        resource: ../src/Administracion/

    App\Seguridad\:
        resource: ../src/Seguridad/
        exclude: ../src/Seguridad/{UsuarioSesion.php,IngresoRechazado.php}

    App\Repository\:
        resource: ../src/Repository/

    App\Command\:
        resource: ../src/Command/

    app.session_pdo:
        class: PDO
        factory: ['@doctrine.dbal.default_connection', 'getNativeConnection']

    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '@app.session_pdo'
            - { db_table: 'sesiones_php', lock_mode: 1 }
