# Las rutas del panel y la demo no se indexan. Un valor vacío omite la cabecera. Usa
# $request_uri porque try_files reescribe $uri a /index.html antes de enviar las cabeceras.
map $request_uri $zenli_robots {
    default                         "";
    ~^/(admin|admin/agenda|demo)(\?|$)  "noindex";
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    client_max_body_size 8m;
    server_tokens off;

    # IP real del cliente para los límites de intentos de acceso. El puerto solo se publica en
    # 127.0.0.1, así que únicamente el proxy HTTPS del VPS llega desde la red de Docker. Sin
    # real_ip_recursive se usa la última dirección de X-Forwarded-For, la que agregó ese proxy:
    # un valor enviado por el cliente no puede reemplazarla.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Cabeceras de seguridad. Se declaran solo en este nivel: nginx descarta las heredadas en
    # cualquier location que defina su propio add_header. PrimeVue inyecta estilos en tiempo de
    # ejecución, por eso style-src admite 'unsafe-inline'; los scripts solo pueden venir del sitio.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag $zenli_robots always;

    # Docker DNS tracks PHP-FPM when the container is replaced.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = / {
        root /srv/zenli;
        ssi on;
        try_files /index.html =404;
    }

    location = /og/metadatos.html {
        internal;
        root /srv/zenli;
        ssi on;
        try_files $uri =404;
    }

    location = /og/zenli.jpg {
        root /srv/zenli;
        try_files $uri =404;
    }

    location = /admin {
        root /srv/zenli;
        try_files /index.html =404;
    }

    location = /admin/agenda {
        root /srv/zenli;
        try_files /index.html =404;
    }

    location = /admin/agenda/ {
        return 308 /admin/agenda;
    }

    location = /admin/ {
        return 308 /admin;
    }

    location = /demo {
        return 404;
    }

    location = /demo/ {
        return 404;
    }

    location /assets/ {
        root /srv/zenli;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        # Symfony ya envía nosniff en las imágenes; se oculta para no duplicar la cabecera de nginx.
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Powered-By;
        set $php_fpm app:9000;
        fastcgi_pass $php_fpm;
    }

    location ~* (?:/\.|\.php(?:/|$)) {
        return 404;
    }
}
